<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Clipboard Fullscreen Loop Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
    }

    #stage.fs {
      background: #111;
      color: white;
    }

    button {
      font-size: 22px;
      padding: 18px 28px;
    }

    #status {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      max-height: 35%;
      overflow: auto;
      padding: 12px;
      background: rgba(0,0,0,.85);
      color: #00ff00;
      font: 12px monospace;
      white-space: pre-wrap;
      z-index: 100;
    }
  </style>
</head>

<body>

<div id="stage">
  <button id="direct">Direct Write</button>
</div>

<div id="status">Ready...</div>

<script>

const stage = document.getElementById("stage");
const button = document.getElementById("direct");
const status = document.getElementById("status");

let running = false;
let attempt = 0;

function log(text) {
  status.textContent += "\n" + text;
  status.scrollTop = status.scrollHeight;
}

async function writeTextTest() {

  attempt++;

  try {

    await navigator.clipboard.writeText(
      "ARC CLIPBOARD TEST"
    );

    log(
      "[" + attempt + "] writeText SUCCESS"
    );

  } catch (e) {

    log(
      "[" + attempt + "] writeText FAILED: " +
      e.name + " - " + e.message
    );
  }
}


async function startTest() {

  if (running)
    return;

  running = true;

  status.textContent = "TEST STARTED";

  /*
   * First write happens directly from the
   * original user click.
   */
  log("Initial async writeText()...");

  await writeTextTest();


  /*
   * Then request fullscreen.
   */
  log("Requesting fullscreen...");

  try {

    await stage.requestFullscreen({
      navigationUI: "hide"
    });

  } catch (e) {

    log(
      "Fullscreen failed: " +
      e.name + " - " + e.message
    );

    running = false;
    return;
  }


  /*
   * Continue attempting writes while the page
   * remains open.
   */
  while (running) {

    await new Promise(resolve =>
      setTimeout(resolve, 1000)
    );

    await writeTextTest();
  }
}


button.addEventListener("click", startTest);


document.addEventListener(
  "fullscreenchange",
  () => {

    const active =
      document.fullscreenElement === stage;

    stage.classList.toggle("fs", active);

    if (active) {
      log("FULLSCREEN ENTERED");
    } else {
      log("FULLSCREEN EXITED");
    }
  }
);


/*
 * Stop when the page is being unloaded.
 */
window.addEventListener("beforeunload", () => {
  running = false;
});

</script>

</body>
</html>
