<button id="asyncBtn">Start Async Test</button>
<button id="fullscreenBtn">Enter Fullscreen</button>

<script>
let running = false;

async function asyncWrite() {
  try {
    await navigator.clipboard.writeText("ARC CLIPBOARD TEST");
    console.log("[+] Clipboard write succeeded");
  } catch (e) {
    console.log("[-] Clipboard write failed:", e.name, e.message);
  }
}

async function clipboardLoop() {
  while (running) {
    await asyncWrite();
    await new Promise(r => setTimeout(r, 1000));
  }
}

// Async test start
document.getElementById("asyncBtn").addEventListener("click", () => {
  if (running) return;

  running = true;
  clipboardLoop();

  console.log("[+] Async clipboard loop started");
});

// Separate fullscreen button
document.getElementById("fullscreenBtn").addEventListener("click", async () => {
  try {
    await document.documentElement.requestFullscreen({
      navigationUI: "hide"
    });
    console.log("[+] Fullscreen entered");
  } catch (e) {
    console.log("[-] Fullscreen failed:", e);
  }
});

// Any touch/click on the page attempts one async write.
// It does NOT read the existing clipboard.
document.addEventListener("pointerdown", () => {
  if (running) {
    asyncWrite();
  }
}, true);

// Also handle touch explicitly
document.addEventListener("touchstart", () => {
  if (running) {
    asyncWrite();
  }
}, {capture: true, passive: true});

// Stop loop when fullscreen exits / page is closed
document.addEventListener("fullscreenchange", () => {
  console.log(
    document.fullscreenElement
      ? "[+] Fullscreen active"
      : "[-] Fullscreen exited"
  );
});

window.addEventListener("beforeunload", () => {
  running = false;
});
</script>
