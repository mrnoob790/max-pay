<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Async Clipboard Fullscreen Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
    }

    #stage.fs {
      background: #111;
      color: white;
    }

    #go {
      font-size: 22px;
      padding: 18px 28px;
    }

    #status {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      max-height: 40%;
      overflow: auto;
      padding: 12px;
      background: rgba(0,0,0,.85);
      color: #00ff00;
      font: 12px monospace;
      white-space: pre-wrap;
      z-index: 100;
    }
  </style>
</head>

<body>

<div id="stage">
  <button id="go">Write text</button>
</div>

<div id="status">Ready...</div>

<script>

const stage = document.getElementById("stage");
const button = document.getElementById("go");
const status = document.getElementById("status");

let running = false;
let count = 0;

function log(text) {
  status.textContent += "\n" + text;
  status.scrollTop = status.scrollHeight;
}

async function clipboardLoop() {

  while (running) {

    count++;

    try {

      await navigator.clipboard.writeText(
        "ARC CLIPBOARD TEST"
      );

      log("WRITE #" + count + " SUCCESS");

    } catch (e) {

      log(
        "WRITE #" + count +
        " FAILED: " +
        e.name +
        " - " +
        e.message
      );
    }

    await new Promise(resolve =>
      setTimeout(resolve, 1000)
    );
  }
}


button.addEventListener("click", async () => {

  if (running)
    return;

  running = true;

  /*
   * STEP 1:
   * Start the async clipboard loop.
   */
  log("ASYNC CLIPBOARD LOOP STARTED");

  clipboardLoop();

  /*
   * STEP 2:
   * Then request fullscreen.
   */
  try {

    await stage.requestFullscreen({
      navigationUI: "hide"
    });

    log("FULLSCREEN REQUESTED");

  } catch (e) {

    log(
      "FULLSCREEN FAILED: " +
      e.name +
      " - " +
      e.message
    );
  }

});


document.addEventListener("fullscreenchange", () => {

  const active =
    document.fullscreenElement === stage;

  stage.classList.toggle("fs", active);

  if (active) {

    log("FULLSCREEN ENTERED");

  } else {

    log("FULLSCREEN EXITED");
    running = false;

  }

});


window.addEventListener("beforeunload", () => {
  running = false;
});

</script>

</body>
</html>
