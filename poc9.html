<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Fullscreen Clipboard Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
    }

    #stage.fs {
      background: #111;
      color: white;
    }

    #go {
      font-size: 22px;
      padding: 18px 28px;
    }

    #status {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 12px;
      background: rgba(0,0,0,.85);
      color: #00ff00;
      font: 13px monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="stage">

  <button id="go">Write text</button>

  <div id="status">Ready...</div>

</div>

<script>

const stage = document.getElementById("stage");
const button = document.getElementById("go");
const status = document.getElementById("status");

function log(text) {
  status.textContent += "\n" + text;
}


/*
 * User clicks button.
 * Only fullscreen is requested here.
 */
button.addEventListener("click", async () => {

  status.textContent = "Button clicked";

  try {

    await stage.requestFullscreen({
      navigationUI: "hide"
    });

    log("Fullscreen request completed");

  } catch (e) {

    log("Fullscreen failed");
    log("Name: " + e.name);
    log("Message: " + e.message);

  }

});


/*
 * Fullscreen transition completed.
 */
document.addEventListener("fullscreenchange", async () => {

  const entered =
    document.fullscreenElement === stage;

  stage.classList.toggle("fs", entered);

  if (!entered) {
    log("Fullscreen exited");
    return;
  }

  log("FULLSCREEN ENTERED");

  /*
   * Wait approximately 500 ms after fullscreen.
   */
  await new Promise(resolve => {
    setTimeout(resolve, 500);
  });

  log("500 ms elapsed");

  log(
    "Secure context: " +
    window.isSecureContext
  );

  log(
    "Clipboard API: " +
    typeof navigator.clipboard
  );

  if (!navigator.clipboard) {

    log("Clipboard API unavailable");
    return;
  }

  try {

    /*
     * Fixed test value only.
     * Does NOT read the existing clipboard.
     */
    await navigator.clipboard.writeText(
      "Fullscreen clipboard test"
    );

    log("WRITE TEXT SUCCESS");

  } catch (e) {

    log("WRITE TEXT FAILED");
    log("Name: " + e.name);
    log("Message: " + e.message);

  }

});

</script>

</body>
</html>
