<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Arc Clipboard Fullscreen Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      position: relative;
    }

    #stage.fs {
      background: #111;
      color: white;
    }

    button {
      font-size: 20px;
      padding: 16px 24px;
      margin: 6px;
    }

    #status {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,.85);
      color: #00ff00;
      padding: 12px;
      font: 12px monospace;
      white-space: pre-wrap;
      z-index: 100;
    }
  </style>
</head>

<body>

<div id="stage">

  <div>
    <button id="direct">Direct Write</button>
    <button id="test">Fullscreen Test</button>
  </div>

</div>

<div id="status">Ready</div>

<script>

const stage = document.getElementById("stage");
const direct = document.getElementById("direct");
const test = document.getElementById("test");
const status = document.getElementById("status");

function log(text) {
  status.textContent += "\n" + text;
}

async function writeTest(label) {

  const text = "ARC CLIPBOARD TEST";

  log("");
  log(label);
  log("clipboard: " + typeof navigator.clipboard);
  log("secure: " + window.isSecureContext);

  if (!navigator.clipboard) {
    log("FAIL: Clipboard API unavailable");
    return;
  }

  try {

    await navigator.clipboard.writeText(text);

    log("SUCCESS: writeText()");

  } catch (e) {

    log("FAILED: writeText()");
    log("Name: " + e.name);
    log("Message: " + e.message);
  }
}


/*
 * CASE 1:
 * Direct user gesture -> clipboard
 */
direct.addEventListener("click", async () => {

  status.textContent = "DIRECT CLICK";

  await writeTest(
    "CASE 1: DIRECT CLICK"
  );

});


/*
 * CASE 2 + CASE 3:
 * User gesture -> fullscreen
 */
test.addEventListener("click", async () => {

  status.textContent = "FULLSCREEN TEST";

  try {

    await stage.requestFullscreen({
      navigationUI: "hide"
    });

  } catch (e) {

    log("Fullscreen failed");
    log(e.name + ": " + e.message);

  }

});


document.addEventListener("fullscreenchange", async () => {

  if (document.fullscreenElement !== stage) {

    stage.classList.remove("fs");
    return;

  }

  stage.classList.add("fs");

  log("");
  log("=== FULLSCREEN ENTERED ===");

  /*
   * CASE 2:
   * Immediately after fullscreenchange.
   */
  await writeTest(
    "CASE 2: IMMEDIATE AFTER FULLSCREEN"
  );


  /*
   * CASE 3:
   * 500 ms after fullscreen.
   */
  setTimeout(async () => {

    await writeTest(
      "CASE 3: 500ms AFTER FULLSCREEN"
    );

  }, 500);

});

</script>

</body>
</html>
