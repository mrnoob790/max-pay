<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Arc LNA Read Test</title>
</head>
<body>

<h2>Arc Localhost Read Test</h2>

<button onclick="testRead()">TEST READ LOCALHOST</button>

<pre id="result">Waiting...</pre>

<script>
async function testRead() {
  const result = document.getElementById("result");

  result.textContent =
    "Trying to read http://localhost:8000/secret ...";

  try {
    const response = await fetch(
      "http://localhost:8000/secret",
      {
        cache: "no-store"
      }
    );

    const text = await response.text();

    result.textContent =
      "READ SUCCESS!\n\n" +
      "HTTP " + response.status + "\n" +
      "Response: " + text;

  } catch (e) {

    result.textContent =
      "READ FAILED\n\n" +
      String(e);
  }
}
</script>

</body>
</html>
